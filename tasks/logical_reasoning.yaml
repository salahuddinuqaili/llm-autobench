id: logical_reasoning
category: reasoning
requires_frontier: false
prompt: |
  A warehouse has 12 shelves. Each shelf holds 8 boxes. Each box holds 10 items.
  If 1/4 of the items are removed for shipping, how many items remain?
  Show your steps, then state your final answer on the last line as
  "Final answer: <number>".
expected:
  answer: "720"
scoring:
  method: exact
  rubric: |
    Binary (method: exact — the scorer returns 1.0 or 0.0, never partial). Scored by
    extracting the LAST "Final answer:" line and comparing by VALUE, so 720, 720.0 and
    "720 items" all pass while 1720 / 7200 do not. Correct working with a wrong final
    answer scores 0 — the stated answer is what is graded.
max_tokens: 2048
tags: [reasoning]