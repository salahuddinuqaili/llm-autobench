# llm-autobench model registry
# PUBLIC repo — no secrets, no private data. Only public models are benchmarked.
#
# Three sections:
#   battery_tags: the shared text battery every general model is measured on
#   baseline:     known models used as a comparison reference (run on every cycle)
#   watcher:      config for autonomous discovery of NEW models to test

# SINGLE SOURCE OF TRUTH for "the full text battery". Both the baselines below and
# the discovered model injected by autobench_cycle.build_temp_registry() use this
# list, so the two can never drift apart again. They did: discovered models were
# given 11 broad tags (all 9 text tasks) while baselines carried narrow hand-written
# tags — qwen3.5:9b attempted only 4, and they were the HARDEST in the battery. The
# leaderboard was comparing a 9-task average against a 4-task average as if they were
# the same number. See DECISIONS.md 2026-08-15.
battery_tags: [
  general, reasoning, coding, writing, summarization,
  instruction_following, structured_output, communication,
  security, python, json,
]

baseline:
  - id: custom:ollama/qwen3.5:9b
    display_name: Qwen3.5 9B (local)
    provider: custom:ollama
    base_url: http://127.0.0.1:11434/v1
    tier: local
    context_window: 32000
    # Full text battery (see battery_tags). A general 9B model can write a
    # changelog; gating it to [reasoning, general, coding] only ever asked it the
    # hard half and then published the result as a cross-model average.
    tags: [general, reasoning, coding, writing, summarization,
           instruction_following, structured_output, communication,
           security, python, json]
    enabled: true

  - id: custom:ollama/gemma4:e4b
    display_name: Gemma4 e4b (local, vision)
    provider: custom:ollama
    base_url: http://127.0.0.1:11434/v1
    tier: local
    context_window: 128000
    # Multimodal AND general: full text battery + vision.
    tags: [general, reasoning, coding, writing, summarization,
           instruction_following, structured_output, communication,
           security, python, json, vision, ocr, progressive]
    enabled: true

  - id: custom:ollama/minicpm-v:latest
    display_name: MiniCPM-V (local, vision)
    provider: custom:ollama
    base_url: http://127.0.0.1:11434/v1
    tier: local
    context_window: 128000
    # Vision-only by design (a small dedicated VLM, not a general text model).
    # Its leaderboard average is therefore NOT comparable to a text-battery
    # average — reports mark vision-only coverage explicitly.
    tags: [vision, ocr, progressive]
    enabled: true

watcher:
  # Only models that FIT the local GPU are pulled. On 12GB VRAM, ~14B is the
  # practical ceiling (qwen3.5:9b = 6.6GB leaves headroom for the judge on free cloud).
  max_params_billions: 14
  # Sources to poll for new tags. Ollama library is the primary public source.
  sources:
    - type: ollama
      library: https://ollama.com/library
      # poll cadence is set by the cron that invokes autobench_cycle.py
  # Judge/reporter model = the autonomous agent itself. FREE tier keeps the local
  # GPU free for the model-under-test. Public repo => free cloud allowed.
  judge: meta/llama-3.3-70b-instruct
  judge_provider: nvidia
  # After benchmarking, the pulled model is DELETED to keep disk/VRAM free.
  delete_after_bench: true
